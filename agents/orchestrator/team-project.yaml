name: "团队项目协作"
description: "项目入职 → 蓝图设计 → 阶段注入 → 并行执行 → 验收 → 汇总纪要。完整团队协作六阶段生命周期，项目牧羊人全程协调。基于三级文件体系（L1蓝图/L2施工/L3纪要），文件驱动、边界保障、可复刻存档。"

agents_dir: "agency-agents-zh"

llm:
  provider: deepseek
  model: deepseek-chat
  max_tokens: 8192

concurrency: 1

inputs:
  - name: project_name
    description: "项目名称（用于文件命名和标题）"
    required: true
  - name: project_background
    description: "项目背景、核心目标、成功标准描述"
    required: true
  - name: team_roles
    description: |
      团队成员列表，每行一个，格式: 角色名|slug|职责|产出物|依赖|负责边界|不负责边界
      示例: 前端开发者|engineering-engineering-frontend-developer|实现前端UI|前端代码+组件文档|UI设计稿|前端开发|后端逻辑
    required: true
  - name: project_dir
    description: "项目文件夹路径，所有产出物将保存在此目录下"
    required: true

steps:
  # ============================================================
  # Stage ①: 入职流程
  # ============================================================
  - id: onboard
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，执行团队入职流程。

      ── 项目信息 ──
      项目名称: {{project_name}}
      项目背景: {{project_background}}
      团队成员: {{team_roles}}
      项目文件夹: {{project_dir}}

      ── 执行清单 ──
      1. **读取角色定义**
         逐个读取每个成员的角色定义文件:
         ~/.gbrain/agent-roles/source/<dept>/<role>.md
         提取：能力描述、核心使命、关键规则

      2. **生成角色任命书**
         为每个成员生成任命书，保存到 {{project_dir}}/任命书/<角色名>_任命书.md
         格式参考: document-templates/角色任命书.md

         任命书必备内容:
         - 基本信息（项目名、角色名、任命日期）
         - 角色定义（能力描述、核心使命、关键规则）
         - 本项目边界声明（我负责 / 我不负责，来自 {{team_roles}} 的第6-7列）
         - 确认签署区

      3. **蓝图对表**
         - 将任命书草案分发给各成员
         - 收集各成员对边界声明的确认
         - 如出现边界争议，组织协商调整
         - 全员确认后锁定任命书

      4. **入职确认**
         - 确认每个成员的任命书已锁定
         - 确认每个成员理解自己的角色边界

      ── 输出 (onboard_result) ──
      入职完成报告，包含:
      - 成员清单及角色定义摘要
      - 全员边界声明确认状态（✅已确认 / ⚠️存在争议）
      - 边界争议项及协商结果（如有）
      - 入职整体状态（通过 / 需调整）
    output: onboard_result

  # ============================================================
  # Stage ②: 蓝图设计
  # ============================================================
  - id: blueprint
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，组织团队成员共同编写项目蓝图。

      ── 输入 ──
      入职报告: {{onboard_result}}
      项目名称: {{project_name}}
      项目背景: {{project_background}}
      团队成员: {{team_roles}}

      ── 执行清单 ──
      参考模板: document-templates/L1_项目蓝图.md

      生成蓝图并保存到 {{project_dir}}/L1_项目蓝图.md，必须包含 8 个章节:

      1. **项目概述与目标**
         - 项目名称、背景、核心目标、成功标准

      2. **时间线与里程碑**
         - 按 Orchestrator 10 阶段填充（Stage 0 预检 → Stage ⑦ 归档）
         - 每阶段含起止日期、里程碑、交付物、负责人

      3. **团队分工矩阵**
         - 基于 {{team_roles}} 填充（角色、职责、产出物、依赖、时间窗口）

      4. **边界声明总表**
         - 基于 {{team_roles}} 的第6-7列填充（负责 / 不负责）

      5. **应变策略**
         - 范围变更流程、时间线调整规则、成员替换流程、质量不达标处理

      6. **团队信息传递规则**
         - 文件格式 Markdown、更新节奏、汇报线路（成员→项目牧羊人→用户）
         - 紧急通道：阻塞问题 2 小时内响应
         - 文档存放位置: {{project_dir}}

      7. **验收标准清单**
         - 基于 {{team_roles}} 第4列的产出物，逐项制定验收标准和验收方式

      8. **项目健康度检查点**
         - CP1 蓝图确认时、CP2 执行中期、CP3 验收前
         - 每检查点含日期和检查内容

      ── 核心原则 ──
      - 团队成员共同参与制定，项目牧羊人负责协调组织
      - 不替代专家做专业决策（专家负责技术细节，牧羊人负责流程）
      - 蓝图锁定后不可随意更改

      ── 输出 (blueprint_draft) ──
      完整的蓝图 Markdown 内容
    depends_on: [onboard]
    output: blueprint_draft

  # ============================================================
  # 🚦 门禁 2: 蓝图审批
  # ============================================================
  - id: blueprint_approval
    type: approval
    prompt: |
      📋 **项目蓝图已生成**
      
      请审阅以下蓝图内容，确认后项目将进入施工阶段。
      蓝图一旦锁定，变更必须经过项目主管确认。

      ```markdown
      {{blueprint_draft}}
      ```

      ──────────────────────────
      输入 **yes** 锁定蓝图并进入施工阶段
      或输入具体的修改意见：
    depends_on: [blueprint]
    output: blueprint_approval_result

  # ============================================================
  # Stage ③: 阶段注入 — 下发阶段任务卡
  # ============================================================
  - id: stage_inject
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，为当前施工阶段下发阶段任务卡。

      ── 输入 ──
      蓝图: {{blueprint_draft}}
      团队成员: {{team_roles}}
      项目文件夹: {{project_dir}}

      ── 执行清单 ──
      参考模板: document-templates/阶段任务卡.md

      1. **确定当前阶段**
         从蓝图第2章"时间线与里程碑"中读取当前待执行阶段

      2. **生成阶段任务卡**
         保存到 {{project_dir}}/阶段任务卡/Stage_N_任务卡.md
         内容包括:
         - 阶段信息（名称、日期、项目主管）
         - 当前阶段目标
         - 任务分配（角色、具体任务、预计产出、时间窗口）
         - 角色边界重申（基于蓝图第4章边界声明总表）
         - 依赖关系（前置依赖 → 后置影响）
         - 协作规则（信息同步方式、阻塞申报、预期轮次）
         - 验收标准（基于蓝图第7章验收标准清单）

      3. **下发任务卡**
         - 向每个成员推送其个人任务部分
         - 确认每个成员收到并理解任务卡内容

      ── 输出 (stage_inject_result) ──
      - 当前阶段编号和名称
      - 任务卡摘要
      - 分发确认状态（每个成员的状态）
    depends_on: [blueprint_approval]
    condition: "{{blueprint_approval_result}} contains yes"
    output: stage_inject_result

  # ============================================================
  # Stage ④: 并行执行 — 团队成员施工
  # ============================================================
  - id: execution
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，协调团队成员按阶段任务卡并行执行施工。

      ── 输入 ──
      阶段任务卡: {{stage_inject_result}}
      蓝图: {{blueprint_draft}}
      团队成员: {{team_roles}}
      项目文件夹: {{project_dir}}

      ── 协调规则 ──

      1. **双轨交付要求**
         每个成员的产出分为两轨:
         - 🚂 轨1 项目交付物: 实现蓝图要求的产出，放入 {{project_dir}}/交付物/
         - 🚂 轨2 施工记录: 维护个人施工记录，参考模板 document-templates/L2_施工记录.md
           保存到 {{project_dir}}/施工文件/<角色名>_施工记录.md
           施工记录必须包含:
           - 文件信息 + 边界声明（开工时写入）
           - 时间线（每项操作标注日期时间，不可断层）
           - 交付物清单（含状态、完成日期、验收结果）
           - 遇到问题与解决
           - 偏差记录

      2. **边界监控（三层防护）**
         A. 蓝图锚定: 每个阶段开工前成员重新确认边界声明
         B. 文件自检: 施工记录首部写边界声明，成员偏移时自查回正
         C. 牧羊人监督: 定期抽查施工记录，检测角色偏移

      3. **偏移检测与纠偏**
         检测到角色偏移时:
         - 轻微偏离 → 提醒成员重新阅读边界声明
         - 严重越界 → 重新注入角色定义 + 边界声明
         - 记录到偏差日志（施工记录 + 项目级偏差汇总）

      4. **阻塞协调**
         - 成员通过施工记录"问题与解决"区汇报阻塞
         - 项目牧羊人 2 小时内响应
         - 无法解决的阻塞升级给用户

      5. **进度跟踪**
         - 每日汇总成员施工记录中的交付物清单
         - 对比蓝图时间线，标记进度偏差
         - 超过计划时间 1.5x → 触发应变策略

      ── 输出 (execution_result) ──
      - 交付物汇总清单（含完成状态）
      - 施工记录完整性检查结果
      - 偏差记录汇总（逐条标注发现方式、严重程度、纠偏状态）
      - 阶段完成确认（通过 / 存在未解决阻塞）
    depends_on: [stage_inject]
    output: execution_result

  # ============================================================
  # Stage ⑤: 验收审查
  # ============================================================
  - id: review
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，组织项目验收审查。

      ── 输入 ──
      蓝图: {{blueprint_draft}}
      执行结果: {{execution_result}}
      项目文件夹: {{project_dir}}

      ── 执行清单 ──

      1. **逐项比对验收标准**
         对照蓝图第7章"验收标准清单"，逐项检查:
         - 交付物是否存在
         - 交付物是否达到验收标准
         - 交付物是否在规定时间窗口内完成
         标记: ✅通过 / ⚠️需修改 / ❌未交付

      2. **施工记录完整性检查**
         检查每个成员的施工记录:
         - 时间线是否连续（无断层）
         - 每项交付物是否标注状态和日期
         - 问题与解决是否记录完整
         - 偏差记录是否如实填写

      3. **偏差汇总与评估**
         从施工记录中汇总所有偏差项:
         - 总偏差数（安全阈值: ≤3）
         - 已纠偏数 / 未纠偏数
         - 严重程度分布

      4. **生成验收报告**
         保存到 {{project_dir}}/验收报告.md

      ── 通过条件 ──
      - 交付物完整度 ≥ 蓝图中规定的内容
      - 施工记录连续、无断层
      - 偏差项 ≤ 3 个，且均已纠偏

      ── 输出 (review_result) ──
      验收报告，包含逐项验收结果、施工记录检查结果、偏差汇总
    depends_on: [execution]
    output: review_result

  # ============================================================
  # 🚦 门禁 5: 验收审批
  # ============================================================
  - id: review_approval
    type: approval
    prompt: |
      📋 **项目验收报告**
      
      请审阅以下验收结果:

      ```markdown
      {{review_result}}
      ```

      ──────────────────────────
      输入 **yes** 确认验收通过并进入汇总阶段
      或输入需修改的具体项（将返回施工阶段修正）:
    depends_on: [review]
    output: review_approval_result

  # ============================================================
  # Stage ⑥: 汇总纪要 + 归档
  # ============================================================
  - id: summary
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，汇总项目纪要并归档。

      ── 输入 ──
      蓝图: {{blueprint_draft}}
      验收报告: {{review_result}}
      执行结果: {{execution_result}}
      项目名称: {{project_name}}
      团队成员: {{team_roles}}
      项目文件夹: {{project_dir}}

      ── 执行清单 ──
      参考模板: document-templates/L3_项目纪要.md

      1. **项目概要（可复刻级别）**
         - 项目类型、角色阵容、总耗时（日历天数）、实际工时（轮次数）
         - 交付物清单（汇总全部成员产出）

      2. **项目时间线总览**
         - 对比蓝图计划时间 vs 实际时间，计算偏差
         - 逐阶段填入偏差原因说明

      3. **关键决策记录**
         - 从施工记录中提取所有"关键决策"列
         - 按时间排列，标注决策者

      4. **偏差与纠偏记录**
         - 汇总项目级偏差日志
         - 评估三层防护机制效果

      5. **经验教训**
         - 本项目的核心教训（3-5条）
         - 对后续项目的启示

      6. **角色迭代建议** ⭐
         逐角色评估项目中的表现:
         - 频繁越界的角色 → 建议补充角色定义中的边界声明
         - 展现未预期能力的角色 → 建议拓展角色定义
         - 性能瓶颈角色 → 标注需优化的环节
         输出表:
         | 角色 | 评估 | 建议操作 | 优先级 |
         |------|------|---------|--------|

      7. **团队模板固化建议**
         - 本次角色组合是否值得固化为团队模板
         - 建议的模板名称和适用场景
         - 建议的蓝图范本调整

      保存到 {{project_dir}}/L3_项目纪要.md

      ── 输出 (project_summary) ──
      完整的项目纪要内容，含角色迭代建议
    depends_on: [review_approval]
    condition: "{{review_approval_result}} contains yes"
    output: project_summary

  # ============================================================
  # 归档触发（可选，由上游流程调用）
  # ============================================================
  - id: archive
    role: "project-management/project-management-project-shepherd"
    task: |
      作为项目牧羊人，确认项目文档已齐全，准备归档。

      ── 输入 ──
      项目纪要: {{project_summary}}
      项目文件夹: {{project_dir}}

      ── 归档清单 ──
      确认以下文件全部就绪:
      ✅ 任命书/ (每个成员一份)
      ✅ L1_项目蓝图.md
      ✅ 阶段任务卡/ (每个阶段一份)
      ✅ 施工文件/<角色名>_施工记录.md (每个成员一份)
      ✅ 验收报告.md
      ✅ L3_项目纪要.md

      ── 后续动作 ──
      1. 项目文件夹整体存档
      2. 如果项目纪要中"团队模板固化建议"为高优先级:
         将蓝图范本提取到 ~/.gbrain/agent-roles/orchestrator/templates/teams/
      3. 如果有角色迭代建议:
         提醒用户执行角色定义更新:
         node ~/.gbrain/agent-roles/sync-index.js

      ── 输出 (archive_result) ──
      归档确认报告，含文件清单和后续建议
    depends_on: [summary]
    output: archive_result
